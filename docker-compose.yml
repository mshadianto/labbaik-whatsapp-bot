# LABBAIK.AI WhatsApp Bot - Docker Compose
version: '3.8'

services:
  labbaik-wa-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labbaik-wa-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WAHA_API_URL=${WAHA_API_URL}
      - WAHA_SESSION=${WAHA_SESSION}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - DATABASE_URL=${DATABASE_URL}
      - DEBUG=${DEBUG:-false}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

